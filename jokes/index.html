<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tommy Cooper-style Joke Generator</title>
    <link rel="icon" type="image/x-icon" href="https://thinkingsystems.co.uk/assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .container:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #d32f2f;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        #fez {
            font-size: 3em;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
            cursor: pointer;
            display: inline-block;
        }
        #fez:hover {
            animation: wobble 0.5s ease infinite;
        }
        @keyframes wobble {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }
        #setup, #punchline {
            font-size: 1.2em;
            margin-bottom: 1rem;
            min-height: 2em;
        }
        #punchline {
            font-weight: bold;
            color: #d32f2f;
        }
        button {
            background-color: #d32f2f;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 18px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        button:hover {
            background-color: #b71c1c;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="fez" role="button" tabindex="0">🎩</div>
        <h1>Just Like That!</h1>
        <p id="setup">Ready for a laugh?</p>
        <p id="punchline">Click the button!</p>
        <button id="jokeButton" type="button">Tell me a joke!</button>
    </div>

    <audio id="soundEffect" src="https://cdn.freesound.org/previews/591/591726_11861866-lq.mp3"></audio>
    <script src="app.js"></script>
</body>
</html>
