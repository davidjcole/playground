<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt Library</title>
  <style>
    :root{
      --bg:#0b0e14;
      --panel:#111827;
      --panel2:#0f172a;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --border:rgba(148,163,184,.18);
      --accent:#22c55e;
      --accent2:#60a5fa;
      --danger:#fb7185;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background: radial-gradient(1200px 600px at 20% -10%, rgba(96,165,250,.18), transparent 60%),
                  radial-gradient(1000px 500px at 90% 0%, rgba(34,197,94,.14), transparent 55%),
                  var(--bg);
      min-height:100vh;
    }
    a{color:inherit}
    .app{
      max-width:1200px;
      margin: 22px auto;
      padding: 0 16px 22px;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding: 14px 14px;
      border:1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(17,24,39,.9), rgba(15,23,42,.75));
      box-shadow: var(--shadow);
      position: sticky;
      top: 10px;
      z-index: 50;
      backdrop-filter: blur(10px);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 220px;
    }
    .logo{
      width:34px;height:34px;border-radius:10px;
      display:grid;place-items:center;
      border:1px solid var(--border);
      background: rgba(96,165,250,.12);
    }
    .brand h1{
      font-size: 16px;
      line-height: 1.1;
      margin:0;
      font-weight: 700;
      letter-spacing: .2px;
    }
    .brand .sub{
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
    }
    .controls{
      flex: 1;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap:wrap;
    }
    .input{
      display:flex;
      gap:10px;
      align-items:center;
      border:1px solid var(--border);
      background: rgba(11,14,20,.55);
      border-radius: 12px;
      padding: 10px 12px;
      min-width: min(520px, 100%);
    }
    .input input{
      width:100%;
      border:0;
      outline:0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
    }
    .pill{
      display:inline-flex;
      gap:8px;
      align-items:center;
      border:1px solid var(--border);
      background: rgba(11,14,20,.55);
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--muted);
    }
    .pill strong{color: var(--text); font-weight: 650}
    .btn{
      border:1px solid var(--border);
      background: rgba(11,14,20,.55);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      cursor:pointer;
      font-size: 13px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition: transform .05s ease, border-color .15s ease, background .15s ease;
      user-select:none;
    }
    .btn:hover{border-color: rgba(96,165,250,.45)}
    .btn:active{transform: translateY(1px)}
    .btn.primary{
      background: rgba(34,197,94,.13);
      border-color: rgba(34,197,94,.35);
    }
    .btn.primary:hover{border-color: rgba(34,197,94,.55)}
    .btn.ghost{
      background: transparent;
    }
    .btn.danger{
      background: rgba(251,113,133,.10);
      border-color: rgba(251,113,133,.30);
    }
    .layout{
      display:grid;
      grid-template-columns: 270px 1fr 420px;
      gap: 14px;
      margin-top: 14px;
    }
    @media (max-width: 1050px){
      .layout{grid-template-columns: 250px 1fr}
      .detail{grid-column: 1 / -1}
    }
    @media (max-width: 860px){
      .layout{grid-template-columns: 1fr}
      .sidebar{position: static}
      .detail{grid-column: auto}
      header{position: static}
      .brand{min-width: auto}
      .input{min-width: 100%}
    }
    .panel{
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(17,24,39,.88), rgba(15,23,42,.7));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .sidebar{
      position: sticky;
      top: 92px;
      height: calc(100vh - 120px);
      overflow:auto;
    }
    .sidebar .section{
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar .section:last-child{border-bottom:0}
    .sidebar h2{
      margin:0 0 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 650;
      letter-spacing:.2px;
      text-transform: uppercase;
    }
    .catList{display:flex; flex-direction:column; gap:8px}
    .catBtn{
      text-align:left;
      width:100%;
      padding: 10px 10px;
      border-radius: 12px;
      border:1px solid var(--border);
      background: rgba(11,14,20,.35);
      color: var(--text);
      cursor:pointer;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .catBtn:hover{border-color: rgba(96,165,250,.45)}
    .catBtn.active{
      background: rgba(96,165,250,.12);
      border-color: rgba(96,165,250,.45);
    }
    .catIcon{font-size:18px; line-height:1.2}
    .catMeta{display:flex; flex-direction:column; gap:2px; min-width:0}
    .catName{font-size: 13.5px; font-weight: 650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .catDesc{font-size: 12px; color: var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .catCount{margin-left:auto; font-size: 12px; color: var(--muted)}
    .main{
      overflow:hidden;
    }
    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .toolbar .left{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .select{
      border:1px solid var(--border);
      background: rgba(11,14,20,.55);
      color: var(--text);
      padding: 9px 10px;
      border-radius: 12px;
      font-size: 13px;
      outline:none;
      cursor:pointer;
    }
    .hint{
      color: var(--muted);
      font-size: 12.5px;
    }
    .list{
      max-height: calc(100vh - 160px);
      overflow:auto;
    }
    @media (max-width: 860px){
      .list{max-height: none}
    }
    .promptRow{
      padding: 12px;
      border-bottom: 1px solid var(--border);
      cursor:pointer;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
    }
    .promptRow:hover{background: rgba(255,255,255,.02)}
    .promptRow.active{background: rgba(34,197,94,.08)}
    .promptTitle{
      font-weight: 700;
      font-size: 14px;
      margin:0 0 3px;
    }
    .promptId{
      font-family: var(--mono);
      color: var(--muted);
      font-size: 12px;
    }
    .rowRight{
      display:flex; gap:8px; align-items:center;
    }
    .star{
      width:32px; height:32px;
      border-radius: 10px;
      border:1px solid var(--border);
      background: rgba(11,14,20,.35);
      color: var(--muted);
      display:grid; place-items:center;
      cursor:pointer;
    }
    .star.active{
      color: var(--accent);
      border-color: rgba(34,197,94,.45);
      background: rgba(34,197,94,.10);
    }
    .detail{
      overflow:hidden;
    }
    .detailHeader{
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display:flex;
      gap:10px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .detailHeader h3{
      margin:0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing:.1px;
    }
    .detailHeader .meta{
      color: var(--muted);
      font-size: 12.5px;
      margin-top: 4px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .detailBody{
      padding: 12px;
      overflow:auto;
      max-height: calc(100vh - 220px);
      white-space: pre-wrap;
      font-family: var(--sans);
      line-height: 1.45;
      font-size: 13.5px;
    }
    @media (max-width: 1050px){
      .detailBody{max-height:none}
    }
    .detailBody pre{
      margin:0;
      font-family: var(--mono);
      background: rgba(11,14,20,.45);
      border:1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      overflow:auto;
    }
    .toast{
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17,24,39,.92);
      border:1px solid var(--border);
      border-radius: 999px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      color: var(--text);
      font-size: 13px;
      display:none;
      gap: 10px;
      align-items:center;
      z-index: 100;
      max-width: calc(100vw - 24px);
      backdrop-filter: blur(10px);
    }
    .toast.show{display:inline-flex}
    .kbd{
      font-family: var(--mono);
      font-size: 12px;
      padding: 2px 6px;
      border:1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
    }
    .empty{
      padding: 18px;
      color: var(--muted);
      font-size: 13.5px;
    }
    .footerNote{
      padding: 12px;
      color: var(--muted);
      font-size: 12.5px;
      border-top: 1px solid var(--border);
    }
  
    .credit{
      margin-top: 14px;
      padding: 12px 14px;
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
    }
    .credit a{
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid rgba(96,165,250,.35);
    }
    .credit a:hover{
      border-bottom-color: rgba(96,165,250,.75);
    }

  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">🧭</div>
        <div>
          <h1 id="appTitle">Prompt Library</h1>
          <div class="sub" id="appSub">Loading…</div>
        </div>
      </div>

      <div class="controls">
        <div class="input" title="Search titles, ids, and prompt text">
          <span style="color:var(--muted)">⌕</span>
          <input id="search" placeholder="Search prompts…" autocomplete="off" />
          <span class="kbd">/</span>
        </div>
        <button class="btn ghost" id="toggleFavs" title="Show only favorites (f)">
          ★ Favorites
        </button>
        <button class="btn danger" id="clearFavs" title="Clear all favorites">
          Clear
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="panel sidebar">
        <div class="section">
          <h2>Categories</h2>
          <div class="catList" id="categories"></div>
        </div>
        <div class="footerNote">
          Tips: <span class="kbd">/</span> focus search, <span class="kbd">↑</span>/<span class="kbd">↓</span> select, <span class="kbd">Enter</span> open, <span class="kbd">c</span> copy, <span class="kbd">f</span> favorites.
        </div>
      </aside>

      <main class="panel main">
        <div class="toolbar">
          <div class="left">
            <select class="select" id="sort">
              <option value="title">Sort: Title</option>
              <option value="id">Sort: ID</option>
              <option value="category">Sort: Category</option>
            </select>
            <span class="hint" id="countHint">0 prompts</span>
          </div>
          <button class="btn primary" id="copyBtn" disabled title="Copy selected prompt (c)">Copy</button>
        </div>
        <div class="list" id="promptList"></div>
      </main>

      <section class="panel detail" aria-live="polite">
        <div class="detailHeader">
          <div>
            <h3 id="detailTitle">Select a prompt</h3>
            <div class="meta" id="detailMeta"></div>
          </div>
          <div style="display:flex; gap:8px; align-items:center">
            <button class="btn" id="copyMarkdownBtn" disabled title="Copy as Markdown">Copy MD</button>
          </div>
        </div>
        <div class="detailBody" id="detailBody">
          <div class="empty">Pick a category or search, then click a prompt.</div>
        </div>
      </section>
    </div>

    <footer class="credit panel">
      <div>
        Based on the work of <a href="https://www.oneusefulthing.org/p/claude-code-and-what-comes-next" target="_blank" rel="noopener noreferrer">Ethan Mollick</a>
      </div>
    </footer>

  </div>

  <div class="toast" id="toast">
    <span id="toastText">Copied</span>
    <span class="kbd">Esc</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
