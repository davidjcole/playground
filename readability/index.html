<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gunning Fog Index Calculator</title>
<link rel="icon" type="image/x-icon" href="https://thinkingsystems.co.uk/assets/favicon.ico">
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        padding: 20px;
        margin: 0;
    }
    h1 {
        color: #333;
    }
    textarea {
        width: 100%;
        height: 200px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
        margin-bottom: 10px;
    }
    button {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }
    button:hover {
        background-color: #45a049;
    }
    p {
        color: #555;
        font-size: 18px;
    }
</style>
</head>
<body>
<h1>Gunning Fog Index Calculator</h1>
<textarea id="textInput" placeholder="Enter your text here..."></textarea>
<br>
<button id="calculateButton" type="button">Calculate Gunning Fog Index</button>
<p id="result"></p>
<p id="description"></p>
<p id="educationLevel"></p>
<script src="app.js"></script>
</body>
</html>
