<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>350 source code generator help</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <nav class="top-nav" aria-label="Primary">
        <a class="nav-link" href="/index.html">Build URLs</a>

        <a class="nav-link nav-link-active" href="/help.html">Help</a>
        <a class="nav-link" href="/settings.html">Settings</a>
      </nav>

      <header class="hero">
        <div class="brand-lockup">
          <img
            class="brand-logo"
            src="https://350.org/wp-content/uploads/2017/05/350-logo-v3-white.svg"
            alt="350 logo"
          />

        <p class="hero-copy">
