<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check the Weather</title>
    <meta name="description" content="Check the current weather for any location and get a simple clothing recommendation.">
    <meta name="robots" content="index,follow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Check the Weather">
    <meta property="og:description" content="Check the current weather for any location and get a simple clothing recommendation.">
    <meta property="og:url" content="https://playground.thinkingsystems.co.uk/weather/">
    <meta property="og:site_name" content="Thinking Systems Playground">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Check the Weather">
    <meta name="twitter:description" content="Check the current weather for any location and get a simple clothing recommendation.">
    <link rel="icon" type="image/x-icon" href="https://thinkingsystems.co.uk/assets/favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Check the Weather</h1>
    <div class="controls">
        <input type="text" id="locationInput" placeholder="Enter location (e.g., London, UK)">
        <button id="getWeatherButton" type="button">Get Weather</button>
        <button id="detectLocationButton" type="button" class="secondary-button">Use my location</button>
    </div>
    <div id="weather">
        <p>Please enter a location and click "Get Weather" to display weather information.</p>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
