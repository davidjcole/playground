<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuzu Booking System</title>
<link rel="icon" type="image/x-icon" href="https://thinkingsystems.co.uk/assets/favicon.ico">
<link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="date-picker-container">
        <h1>Zuzu Booking System</h1>
        <label for="start-date">Start Date:</label>
        <input type="date" id="start-date">
        <label for="end-date">End Date:</label>
        <input type="date" id="end-date">
        <button id="submit-booking" type="button">Submit</button>
        <div id="output"></div>
    </div>
    <footer>
        <p>Pricing: regular days £20, public holidays £40, plus an extra £10 per day from 23 December to 4 January. Public holiday data is for England and Wales and currently includes 2024 to 2027.</p>
        <p><a href="https://www.mortramsmoggies.com/rates" target="_blank" rel="noopener noreferrer">View the full rates information</a></p>
    </footer>
<script src="script.js"></script>
</body>
</html>
